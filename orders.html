<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIXORA | My Orders</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
    <style>
        @keyframes orderFadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
            max-width: 840px;
            margin: 0 auto;
        }
        .order-card {
            background: rgba(68, 35, 49, 0.85);
            backdrop-filter: blur(14px);
            border-radius: var(--radius-lg);
            padding: 2.25rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(255, 200, 87, 0.2);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            animation: orderFadeIn 0.5s ease both;
            color: #FFF7ED;
        }
        .order-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: #FFC857;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 200, 87, 0.2);
            padding-bottom: 1.1rem;
            margin-bottom: 1.5rem;
        }
        .status-badge {
            display: inline-block;
            padding: 0.35rem 0.9rem;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }
        .status-New { background: #e2e8f0; color: #475569; }
        .status-Confirmed { background: #fef08a; color: #854d0e; }
        .status-Preparing { background: #fed7aa; color: #c2410c; }
        .status-Ready { background: #bbf7d0; color: #166534; }
        .status-Completed { background: #28a745; color: #fff; }
        .status-Cancelled { background: #fecaca; color: #991b1b; }
        
        .order-item-list {
            margin-bottom: 1.5rem;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.85rem;
            padding: 0.5rem 0;
            border-bottom: 1px dashed rgba(18, 53, 48, 0.06);
        }
        .order-item:last-child {
            border-bottom: none;
        }
        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1.5px solid var(--clr-border);
            padding-top: 1.25rem;
        }
        .order-total {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--clr-primary);
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">MIXORA</a>
            <nav class="main-nav">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="customizer.html">Create Your Drink</a></li>
                    <li><a href="lab.html">Personality Lab</a></li>
                    <li><a href="orders.html" class="active">My Orders</a></li>
                </ul>
            </nav>
            <div class="nav-actions">
                <a href="profile.html" class="icon-link profile-link" aria-label="Profile">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </a>
                <a href="cart.html" class="icon-link cart-link" aria-label="Cart">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container section-padding">
        <h1 class="store-header">Order History</h1>
        
        <div class="orders-list" id="orders-container">
            <!-- Populated by JS -->
        </div>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/pricing.js"></script>
    <script src="js/cart.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const allOrders = window.Storage.get(window.Storage.KEYS.ORDERS, []);
            const activeUser = window.Storage.UserProfile ? window.Storage.UserProfile.get() : window.Storage.get(window.Storage.KEYS.USER);
            const container = document.getElementById('orders-container');
            
            // Filter orders belonging to this customer account
            const userOrders = allOrders.filter(o => {
                if (!activeUser) return false;
                if (o.customer && o.customer.email) {
                    return o.customer.email.toLowerCase() === activeUser.email.toLowerCase();
                }
                return false;
            });
            
            if (userOrders.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 3.5rem 2rem; background: rgba(68, 35, 49, 0.7); border-radius: var(--radius-lg); border: 1.5px dashed rgba(255, 200, 87, 0.3);">
                        <div style="font-size: 3rem; margin-bottom: 0.5rem;">📦</div>
                        <h3 style="color: #FFF7ED; margin-bottom: 0.5rem;">No orders yet.</h3>
                        <p class="text-muted" style="margin-bottom: 1.5rem; max-width: 420px; margin-left: auto; margin-right: auto;">When you place orders for handcrafted boba creations, their live preparation status will appear here.</p>
                        <a href="menu.html" class="btn btn-primary">Start Ordering</a>
                    </div>
                `;
                return;
            }
            
            userOrders.forEach(order => {
                const date = new Date(order.date).toLocaleString();
                let itemsHtml = order.items.map(item => {
                    const addonsArr = [];
                    if(item.bobas) addonsArr.push(...item.bobas);
                    if(item.jellies) addonsArr.push(...item.jellies);
                    if(item.milks_foams) addonsArr.push(...item.milks_foams);
                    if(item.syrups) addonsArr.push(...item.syrups);
                    if(item.garnishes) addonsArr.push(...item.garnishes);
                    const addonsStr = addonsArr.length ? `<br>+ ${addonsArr.join(', ')}` : '';
                    return `
                    <div class="order-item">
                        <div>
                            <strong>${item.quantity}x ${item.name}</strong> <span class="text-muted">(${item.size})</span>
                            <div style="font-size: 0.85rem; color: var(--clr-text-muted); margin-left: 1.2rem;">
                                ${item.sugar} Sugar, ${item.ice}
                                ${addonsStr}
                            </div>
                        </div>
                        <div>${window.Pricing.formatPrice(item.unitPrice * item.quantity)}</div>
                    </div>
                    `;
                }).join('');
                
                const card = document.createElement('div');
                card.className = 'order-card';
                card.innerHTML = `
                    <div class="order-header">
                        <div>
                            <h3 style="margin-bottom: 0.25rem;">${order.orderId}</h3>
                            <span class="text-muted" style="font-size: 0.85rem;">${date} • ${order.fulfillment.type}</span>
                        </div>
                        <div class="status-badge status-${order.status}">${order.status}</div>
                    </div>
                    <div class="order-item-list">
                        ${itemsHtml}
                    </div>
                    <div class="order-footer">
                        <span class="text-muted" style="font-size: 0.9rem;">Items: ${order.items.reduce((s, i) => s + i.quantity, 0)}</span>
                        <span class="order-total">${window.Pricing.formatPrice(order.totals.total)}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
