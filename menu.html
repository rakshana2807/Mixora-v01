<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIXORA | Menu</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/store.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">MIXORA</a>
            
            <button class="mobile-nav-toggle" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <nav class="main-nav">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html" class="active">Menu</a></li>
                    <li><a href="customizer.html">Create Your Drink</a></li>
                    <li><a href="lab.html">Personality Lab</a></li>
                    <li><a href="orders.html">My Orders</a></li>
                </ul>
            </nav>
            
            <div class="nav-actions">
                <a href="profile.html" class="icon-link profile-link" aria-label="Profile">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </a>
                <a href="cart.html" class="icon-link cart-link" aria-label="Cart">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="store-layout container section-padding">
        <div class="store-header">
            <h1>Our Menu</h1>
            <p class="text-muted">Explore our carefully crafted recipes or create your own.</p>
        </div>
        
        <div class="store-controls">
            <div class="search-box">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="menu-search" placeholder="Search drinks...">
            </div>
            <div class="category-filters" id="category-filters">
                <button class="filter-btn active" data-category="All">All Drinks</button>
                <button class="filter-btn" data-category="Best Sellers">Best Sellers</button>
                <button class="filter-btn" data-category="Milk Tea">Milk Tea</button>
                <button class="filter-btn" data-category="Brown Sugar Boba">Brown Sugar Boba</button>
                <button class="filter-btn" data-category="Matcha">Matcha</button>
                <button class="filter-btn" data-category="Coffee">Coffee</button>
                <button class="filter-btn" data-category="Fruit Tea">Fruit Tea</button>
                <button class="filter-btn" data-category="Milkshakes">Milkshakes</button>
                <button class="filter-btn" data-category="Smoothies">Smoothies</button>
                <button class="filter-btn" data-category="Seasonal Specials">Seasonal</button>
            </div>
        </div>

        <div class="drinks-grid" id="full-menu-grid">
            <!-- Populated by JS -->
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-bottom">
            <p>&copy; 2026 MIXORA. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/pricing.js"></script>
    <script src="js/menu-data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
