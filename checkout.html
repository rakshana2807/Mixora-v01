<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIXORA | Checkout</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
    <style>
        @keyframes checkoutEntrance {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes successPop {
            0% {
                transform: scale(0.6);
                opacity: 0;
            }
            70% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .checkout-layout {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 2.5rem;
            align-items: start;
            animation: checkoutEntrance 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .checkout-form {
            background: rgba(68, 35, 49, 0.85);
            backdrop-filter: blur(14px);
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(255, 200, 87, 0.2);
            color: #FFF7ED;
        }
        .checkout-form h3 {
            color: #FFC857;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.55rem;
            font-weight: 700;
            font-size: 0.95rem;
            color: #FFF7ED;
        }
        .form-control {
            width: 100%;
            padding: 0.85rem 1.1rem;
            border: 1.5px solid rgba(255, 200, 87, 0.25);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 1rem;
            background: rgba(43, 20, 31, 0.85);
            color: #FFF7ED;
            transition: all 0.25s ease;
        }
        .form-control:focus {
            outline: none;
            border-color: #FFC857;
            box-shadow: 0 0 15px rgba(255, 200, 87, 0.3);
            transform: translateY(-1px);
        }
        .radio-group {
            display: flex;
            gap: 1rem;
        }
        .radio-option {
            flex: 1;
            border: 1.5px solid rgba(255, 200, 87, 0.25);
            border-radius: var(--radius-md);
            padding: 1.1rem 1rem;
            cursor: pointer;
            text-align: center;
            background: rgba(59, 31, 43, 0.85);
            color: #FFF7ED;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .radio-option:hover {
            border-color: #FFC857;
            transform: translateY(-2px);
        }
        .radio-option input { display: none; }
        .radio-option input:checked + div {
            font-weight: 800;
            color: #3B1F2B;
        }
        .radio-option:has(input:checked) {
            border-color: #FF6B81;
            background: linear-gradient(135deg, #FF6B81 0%, #FFC857 100%);
            box-shadow: 0 4px 16px rgba(255, 107, 129, 0.4);
            transform: translateY(-2px);
        }
        .error-msg {
            color: #FF6B81;
            font-size: 0.85rem;
            margin-top: 0.35rem;
            display: none;
            font-weight: 600;
        }
        @media (max-width: 768px) {
            .checkout-layout { grid-template-columns: 1fr; gap: 1.5rem; }
            .checkout-form { padding: 1.75rem 1.25rem; }
        }
        @media (max-width: 480px) {
            .checkout-form { padding: 1.25rem 1rem; }
            .store-header { font-size: 2rem; }
        }
        
        /* Modal for Success */
        .success-modal {
            display: none;
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: rgba(29, 14, 21, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center; justify-content: center;
            text-align: center;
        }
        .success-modal .modal-content {
            background: #3B1F2B;
            border: 1.5px solid rgba(255, 200, 87, 0.35);
            padding: 3.5rem 2.5rem;
            border-radius: var(--radius-lg);
            max-width: 440px;
            width: 90%;
            color: #FFF7ED;
            box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 35px rgba(255, 107, 129, 0.3);
            animation: successPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        .success-icon {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #A8D5BA 0%, #5bb882 100%);
            color: #1A3E2B;
            border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 24px rgba(168, 213, 186, 0.4);
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">MIXORA</a>
            <div class="nav-actions">
                <a href="profile.html" class="icon-link profile-link" aria-label="Profile">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </a>
                <a href="cart.html" class="icon-link cart-link" aria-label="Cart">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container section-padding">
        <h1 class="store-header" style="text-align: left;">Checkout</h1>
        
        <div class="checkout-layout">
            <div class="checkout-form">
                <form id="checkout-form">
                    <h3>Contact Information</h3>
                    <div class="form-group" style="margin-top: 1rem;">
                        <label>Full Name</label>
                        <input type="text" class="form-control" id="c-name" required>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" class="form-control" id="c-email" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" class="form-control" id="c-phone" required>
                    </div>
                    
                    <h3 style="margin-top: 2rem;">Fulfillment</h3>
                    <div class="form-group" style="margin-top: 1rem;">
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="fulfillment" value="Pickup" checked>
                                <div>Pickup at Store</div>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="fulfillment" value="Delivery">
                                <div>Delivery</div>
                            </label>
                        </div>
                    </div>
                    
                    <div id="address-fields" style="display: none;">
                        <div class="form-group">
                            <label>Delivery Address</label>
                            <textarea class="form-control" id="c-address" rows="3"></textarea>
                        </div>
                    </div>
                    
                    <h3 style="margin-top: 2rem;">Payment</h3>
                    <p class="text-muted" style="margin-bottom: 1rem;">This is a demo. Payment is simulated.</p>
                    <div class="form-group">
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="payment" value="Pay at Pickup" checked>
                                <div>Pay at Pickup / Cash on Delivery</div>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Order Notes (Optional)</label>
                        <textarea class="form-control" id="c-notes" rows="2"></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; margin-top: 1rem;">Place Order</button>
                    <div id="form-error" class="error-msg text-center" style="margin-top: 1rem;"></div>
                </form>
            </div>
            
            <div class="cart-summary" style="top: 2rem; position: sticky;">
                <h3>Order Summary</h3>
                <div id="checkout-items" style="margin: 1.5rem 0; border-bottom: 1px solid var(--clr-border); padding-bottom: 1rem;">
                    <!-- JS injects items -->
                </div>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="c-subtotal">₹0.00</span>
                </div>
                <div class="summary-row">
                    <span>Taxes & Fees</span>
                    <span id="c-fees">₹0.00</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="c-total">₹0.00</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Success Modal -->
    <div class="success-modal" id="success-modal">
        <div class="modal-content">
            <div class="success-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <h2>Order Placed!</h2>
            <p class="text-muted" style="margin: 1rem 0;">Your order has been received and is being processed.</p>
            <p style="font-weight: 600; margin-bottom: 2rem;">Order ID: <span id="success-order-id"></span></p>
            <a href="orders.html" class="btn btn-primary" style="width: 100%;">Track Order</a>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/pricing.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
