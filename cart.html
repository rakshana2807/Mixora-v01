<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIXORA | Your Cart</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/store.css">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">MIXORA</a>
            
            <nav class="main-nav">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="customizer.html">Create Your Drink</a></li>
                    <li><a href="lab.html">Personality Lab</a></li>
                    <li><a href="orders.html">My Orders</a></li>
                </ul>
            </nav>
            
            <div class="nav-actions">
                <a href="profile.html" class="icon-link profile-link" aria-label="Profile">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                </a>
                <a href="cart.html" class="icon-link cart-link active" aria-label="Cart">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container section-padding">
        <h1 class="store-header" style="text-align: left;">Your Cart</h1>
        
        <div class="cart-layout" id="cart-content">
            <!-- Populated by JS -->
            <div class="cart-items" id="cart-items-container">
                <!-- Items here -->
            </div>
            
            <div class="cart-summary">
                <h3>Order Summary</h3>
                <div class="summary-row" style="margin-top: 1.5rem;">
                    <span>Subtotal</span>
                    <span id="summary-subtotal">₹0.00</span>
                </div>
                <div class="summary-row">
                    <span>Taxes & Fees</span>
                    <span id="summary-fees">₹0.00</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="summary-total">₹0.00</span>
                </div>
                <a href="checkout.html" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;" id="checkout-btn">Proceed to Checkout</a>
                <button class="btn btn-outline" style="width: 100%; margin-top: 0.5rem;" id="clear-cart-btn">Clear Cart</button>
            </div>
        </div>

        <div id="empty-cart-msg" style="display: none; text-align: center; padding: 4rem 0;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="text-muted"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <h2 style="margin: 1rem 0;">Your cart is empty</h2>
            <p class="text-muted" style="margin-bottom: 2rem;">Looks like you haven't added any delicious drinks yet.</p>
            <a href="menu.html" class="btn btn-primary">Browse Menu</a>
        </div>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/pricing.js"></script>
    <script src="js/menu-data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/cart-ui.js"></script>
</body>
</html>
